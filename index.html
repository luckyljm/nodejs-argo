<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eooce 小钢炮脚本</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  min-height:100vh;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  padding:20px;
  color:#fff;
}

.container{
  max-width:1300px;
  margin:auto;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:30px;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:30px;
}

h1{
  font-size:32px;
}

.btn-group{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  border:none;
  cursor:pointer;
  transition:.3s;
}

.top-btn{
  padding:10px 18px;
  border-radius:12px;
  font-size:14px;
  font-weight:bold;
  color:white;
}

.clear-btn{
  background:#ff5252;
}

.import-btn{
  background:#42a5f5;
}

.top-btn:hover,
.small-btn:hover,
.generate-btn:hover{
  opacity:.9;
  transform:translateY(-2px);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:20px;
}

.card{
  background:rgba(255,255,255,0.08);
  border-radius:16px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.1);
}

.card h2{
  font-size:20px;
  margin-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,0.15);
  padding-bottom:10px;
}

.form-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
}

input,
select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  background:rgba(255,255,255,0.12);
  color:#fff;
  outline:none;
  transition:.3s;
}

input::placeholder{
  color:rgba(255,255,255,0.5);
}

input:focus,
select:focus{
  background:rgba(255,255,255,0.18);
  box-shadow:0 0 0 2px rgba(255,255,255,0.2);
}

select option{
  color:#000;
}

.row{
  display:flex;
  gap:10px;
  align-items:end;
}

.small-btn{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#5c6bc0;
  color:white;
  font-size:20px;
  flex-shrink:0;
}

.generate-area{
  text-align:center;
  margin-top:30px;
}

.generate-btn{
  padding:16px 60px;
  border-radius:999px;
  background:linear-gradient(135deg,#ff5252,#5c6bc0);
  color:white;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.result{
  margin-top:30px;
  background:#0f172a;
  border-radius:16px;
  padding:20px;
  display:none;
}

.result-title{
  margin-bottom:10px;
  color:#93c5fd;
  font-size:15px;
}

.command{
  background:rgba(255,255,255,0.05);
  border-radius:10px;
  padding:15px;
  line-height:1.7;
  word-break:break-all;
  color:#4ade80;
  cursor:pointer;
  font-family:Consolas,monospace;
}

.command:hover{
  background:rgba(255,255,255,0.08);
}

.copy-tip{
  margin-top:8px;
  font-size:12px;
  color:#cbd5e1;
}

.footer{
  margin-top:30px;
  text-align:center;
  color:rgba(255,255,255,0.8);
  font-size:14px;
}

.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:rgba(255,255,255,0.06);
  padding:12px 14px;
  border-radius:12px;
}

.switch-row input[type="checkbox"]{
  width:20px;
  height:20px;
  accent-color:#5c6bc0;
  cursor:pointer;
  flex-shrink:0;
}

textarea.hidden-copy{
  position:fixed;
  top:-9999px;
  left:-9999px;
  opacity:0;
}

@media (max-width:768px){

  .header{
    flex-direction:column;
    text-align:center;
  }

  .btn-group{
    justify-content:center;
  }

  h1{
    font-size:26px;
  }

}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🚀 eooce 小钢炮脚本</h1>

<div class="btn-group">
<button class="top-btn clear-btn" onclick="clearAll()">清空配置</button>
<button class="top-btn import-btn" onclick="pasteNezha()">导入哪吒配置</button>
</div>
</div>

<div class="grid">

<div class="card">
<h2>基础配置</h2>

<div class="form-group">
<label>脚本类型</label>

<select id="scriptType">
<option value="sb">Sing-box</option>
<option value="argox">Argo-Xray</option>
</select>
</div>

<div class="form-group">
<label>NAME</label>
<input type="text" id="name" placeholder="节点名称">
</div>

<div class="form-group">
<label>UUID</label>

<div class="row">
<input type="text" id="uuid" placeholder="自动生成 UUID">
<button type="button" class="small-btn" onclick="generateUUID()">⚡</button>
</div>
</div>

<div class="form-group">
<label>CFIP</label>

<div class="row">
<input type="text" id="cfip" placeholder="优选域名/IP">
<button type="button" class="small-btn" onclick="randomCFIP()">🎲</button>
</div>
</div>

<div class="form-group">
<label>CFPORT</label>
<input type="text" id="cfport" placeholder="443">
</div>
</div>

<div class="card">
<h2>哪吒监控</h2>

<div class="form-group">
<label>NEZHA_SERVER</label>
<input type="text" id="nezhaServer" placeholder="nz.example.com:8008">
</div>

<div class="form-group">
<label>NEZHA_PORT</label>
<input type="text" id="nezhaPort" placeholder="v0 版本填写">
</div>

<div class="form-group">
<label>NEZHA_KEY</label>
<input type="text" id="nezhaKey" placeholder="输入密钥">
</div>
</div>

<div class="card">
<h2>订阅配置</h2>

<div class="form-group">
<label>CHAT_ID</label>
<input type="text" id="chatId" placeholder="Telegram Chat ID">
</div>

<div class="form-group">
<label>BOT_TOKEN</label>
<input type="text" id="botToken" placeholder="Telegram Bot Token">
</div>

<div class="form-group">
<label>UPLOAD_URL</label>
<input type="text" id="uploadUrl" placeholder="订阅上传地址">
</div>
</div>

<div class="card">
<h2>Argo 隧道配置</h2>

<div class="form-group">
<label class="switch-row">
<span>禁用 Argo 隧道</span>
<input type="checkbox" id="disableArgo">
</label>
</div>

<div class="form-group">
<label>ARGO_PORT</label>
<input type="text" id="argoPort" placeholder="8001">
</div>

<div class="form-group">
<label>ARGO_DOMAIN</label>
<input type="text" id="argoDomain" placeholder="隧道域名">
</div>

<div class="form-group">
<label>ARGO_AUTH</label>
<input type="text" id="argoAuth" placeholder="隧道密钥">
</div>
</div>

<div class="card">
<h2>AnyTls 配置</h2>

<div class="form-group">
<label>ANYTLS_PORT</label>

<div class="row">
<input type="text" id="anytlsPort" placeholder="AnyTls 端口">
<button type="button" class="small-btn" onclick="randomPort('anytlsPort')">🎲</button>
</div>
</div>

<div class="form-group">
<label>ANYREALITY_PORT</label>

<div class="row">
<input type="text" id="anyrealityPort" placeholder="AnyReality 端口">
<button type="button" class="small-btn" onclick="randomPort('anyrealityPort')">🎲</button>
</div>
</div>
</div>

<div class="card">
<h2>直连端口</h2>

<div class="form-group">
<label>HY2_PORT</label>

<div class="row">
<input type="text" id="hy2Port" placeholder="输入端口">
<button type="button" class="small-btn" onclick="randomPort('hy2Port')">🎲</button>
</div>
</div>

<div class="form-group">
<label>REALITY_PORT</label>

<div class="row">
<input type="text" id="realityPort" placeholder="输入端口">
<button type="button" class="small-btn" onclick="randomPort('realityPort')">🎲</button>
</div>
</div>

<div class="form-group">
<label>TUIC_PORT</label>

<div class="row">
<input type="text" id="tuicPort" placeholder="输入端口">
<button type="button" class="small-btn" onclick="randomPort('tuicPort')">🎲</button>
</div>
</div>
</div>

</div>

<div class="generate-area">
<button class="generate-btn" onclick="generateCommand()">生成安装命令</button>
</div>

<div class="result" id="result">

<div class="result-title">安装命令（点击复制）</div>

<div class="command"
id="command"
onclick="copyCommand('command')">
</div>

<div class="copy-tip">
点击命令即可复制
</div>

<div class="result-title" style="margin-top:20px;">
卸载命令（点击复制）
</div>

<div class="command"
id="uninstallCommand"
onclick="copyCommand('uninstallCommand')">
pkill -f '\.tmp/'
</div>

<div class="copy-tip">
点击命令即可复制
</div>

</div>

<div class="footer">
Copyright © 2026 | 单文件静态版 Index.html
</div>

</div>

<textarea id="hiddenCopy" class="hidden-copy"></textarea>

<script>

function generateUUID(){

  const uuid =
  'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'
  .replace(/[xy]/g,function(c){

    const r = Math.random()*16|0;
    const v = c === 'x'
    ? r
    : (r&0x3|0x8);

    return v.toString(16);

  });

  document.getElementById('uuid').value = uuid;

}

function randomPort(id){

  const port =
  Math.floor(Math.random()*(65000-2000+1))+2000;

  document.getElementById(id).value = port;

}

function randomCFIP(){

  const list = [
    'mfa.gov.ua',
    'cf.090227.xyz',
    'store.ubi.com',
    'cf.zhetengsha.eu.org',
    'sub.danfeng.eu.org'
  ];

  const item =
  list[Math.floor(Math.random()*list.length)];

  document.getElementById('cfip').value = item;

}

function clearAll(){

  document
  .querySelectorAll('input[type="text"]')
  .forEach(input => {
    input.value = '';
  });

  document.getElementById('disableArgo').checked = false;

  document.getElementById('result').style.display = 'none';

}

async function pasteNezha(){

  try{

    const text =
    await navigator.clipboard.readText();

    const server =
    text.match(/NZ_SERVER=([^\s]+)/);

    const secret =
    text.match(/NZ_CLIENT_SECRET=([^\s]+)/);

    const uuid =
    text.match(/NZ_UUID=([^\s]+)/);

    if(server){
      document.getElementById('nezhaServer').value = server[1];
    }

    if(secret){
      document.getElementById('nezhaKey').value = secret[1];
    }

    if(uuid){
      document.getElementById('uuid').value = uuid[1];
    }

    alert('哪吒配置导入成功');

  }catch(e){

    alert('当前环境不允许读取剪贴板');

  }

}

function generateCommand(){

  const fields = [

    ['name','NAME'],
    ['uuid','UUID'],
    ['cfip','CFIP'],
    ['cfport','CFPORT'],

    ['nezhaServer','NEZHA_SERVER'],
    ['nezhaPort','NEZHA_PORT'],
    ['nezhaKey','NEZHA_KEY'],

    ['chatId','CHAT_ID'],
    ['botToken','BOT_TOKEN'],
    ['uploadUrl','UPLOAD_URL'],

    ['argoPort','ARGO_PORT'],
    ['argoDomain','ARGO_DOMAIN'],
    ['argoAuth','ARGO_AUTH'],

    ['hy2Port','HY2_PORT'],
    ['realityPort','REALITY_PORT'],
    ['tuicPort','TUIC_PORT'],

    ['anytlsPort','ANYTLS_PORT'],
    ['anyrealityPort','ANYREALITY_PORT']

  ];

  let arr = [];

  if(document.getElementById('disableArgo').checked){

    arr.push('DISABLE_ARGO=true');

  }

  fields.forEach(item => {

    const value =
    document.getElementById(item[0])
    .value
    .trim();

    if(value){

      arr.push(item[1] + '=' + value);

    }

  });

  const scriptType =
  document.getElementById('scriptType').value;

  let scriptUrl =
  'https://main.ssss.nyc.mn/sb.sh';

  if(scriptType === 'argox'){

    scriptUrl =
    'https://main.ssss.nyc.mn/argox.sh';

  }

  const cmd =
  arr.join(' ') +
  ' bash <(curl -Ls ' +
  scriptUrl +
  ')';

  document.getElementById('command').textContent = cmd;

  document.getElementById('result').style.display = 'block';

}

function fallbackCopyText(text){

  const textarea =
  document.getElementById('hiddenCopy');

  textarea.value = text;

  textarea.focus();

  textarea.select();

  try{

    const success =
    document.execCommand('copy');

    if(success){

      alert('命令已复制');

    }else{

      alert('复制失败，请手动复制');

    }

  }catch(err){

    alert('当前浏览器不支持自动复制');

  }

}

function copyCommand(id){

  const text =
  document.getElementById(id).textContent;

  if(navigator.clipboard && window.isSecureContext){

    navigator.clipboard
    .writeText(text)

    .then(() => {

      alert('命令已复制');

    })

    .catch(() => {

      fallbackCopyText(text);

    });

  }else{

    fallbackCopyText(text);

  }

}

</script>

</body>
</html>
